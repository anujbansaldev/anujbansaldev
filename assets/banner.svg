<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2DFAA" />
      <stop offset="35%" stop-color="#D4A63A" />
      <stop offset="70%" stop-color="#EAD68C" />
      <stop offset="100%" stop-color="#9A6F1A" />
    </linearGradient>

    <!-- Subtle Glow Gradient -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A63A" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#D4A63A" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#D4A63A" stroke-opacity="0.05" stroke-width="1" />
      <circle cx="25" cy="0" r="1" fill="#D4A63A" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Canvas Background (Transparent with subtle rounded card border) -->
  <rect width="1000" height="200" fill="#0d1117" fill-opacity="0.6" rx="12" stroke="#D4A63A" stroke-opacity="0.25" stroke-width="1" />
  <rect width="1000" height="200" fill="url(#grid)" rx="12" />
  <rect width="1000" height="200" fill="url(#glow)" rx="12" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1000" height="3" fill="url(#gold-grad)" rx="1.5" />

  <!-- Side Code Brackets (Decorative) -->
  <g fill="#D4A63A" opacity="0.2" font-family="Consolas, Monaco, monospace" font-size="44" font-weight="bold">
    <text x="60" y="115" text-anchor="middle">&lt;/&gt;</text>
    <text x="940" y="115" text-anchor="middle">{ ... }</text>
  </g>

  <!-- Location Badge Pill -->
  <rect x="385" y="24" width="230" height="24" fill="#161b22" stroke="#D4A63A" stroke-opacity="0.5" stroke-width="1" rx="12" />
  <text x="500" y="40" text-anchor="middle" fill="#EAD68C" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">INDORE, INDIA • FREELANCE</text>

  <!-- Main Headline (Anuj Bansal) -->
  <text x="500" y="102" text-anchor="middle" fill="url(#gold-grad)" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="900" letter-spacing="1">Anuj Bansal</text>

  <!-- Subheadline / Role -->
  <text x="500" y="140" text-anchor="middle" fill="#F7F7F5" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="2" opacity="0.95">FULL STACK DEVELOPER • NEXT.JS &amp; MERN ARCHITECT</text>

  <!-- Subtitle Feature Pills -->
  <text x="500" y="170" text-anchor="middle" fill="#A8956E" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="1">High-Performance Web Apps • Headless Payload CMS • Scalable Infrastructure</text>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="197" width="1000" height="3" fill="url(#gold-grad)" rx="1.5" />
</svg>
