<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Dark Ink Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090909" />
      <stop offset="40%" stop-color="#111111" />
      <stop offset="80%" stop-color="#181613" />
      <stop offset="100%" stop-color="#0E0D0B" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2DFAA" />
      <stop offset="35%" stop-color="#D4A63A" />
      <stop offset="70%" stop-color="#EAD68C" />
      <stop offset="100%" stop-color="#9A6F1A" />
    </linearGradient>

    <!-- Subtle Glow Gradient -->
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#D4A63A" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#D4A63A" stroke-opacity="0.04" stroke-width="1" />
      <circle cx="30" cy="0" r="1.2" fill="#D4A63A" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="240" fill="url(#bg-grad)" rx="12" />
  <rect width="1200" height="240" fill="url(#grid)" rx="12" />
  <rect width="1200" height="240" fill="url(#glow)" rx="12" />

  <!-- Top & Bottom Border Bars -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#gold-grad)" rx="2" />
  <rect x="0" y="236" width="1200" height="4" fill="url(#gold-grad)" rx="2" />

  <!-- Subtle Ambient Waves at Bottom -->
  <path d="M 0 170 Q 300 135 600 160 T 1200 145 L 1200 240 L 0 240 Z" fill="#D4A63A" fill-opacity="0.04" />
  <path d="M 0 190 Q 350 160 700 185 T 1200 170 L 1200 240 L 0 240 Z" fill="url(#gold-grad)" fill-opacity="0.15" />

  <!-- Decorative Side Code Brackets (Properly Margined) -->
  <g fill="#D4A63A" opacity="0.18" font-family="Consolas, Monaco, monospace" font-size="54" font-weight="bold">
    <text x="70" y="140" text-anchor="middle">&lt;/&gt;</text>
    <text x="1130" y="140" text-anchor="middle">{ ... }</text>
  </g>

  <!-- Location Badge Pill -->
  <rect x="475" y="32" width="250" height="26" fill="#1C1A16" stroke="#D4A63A" stroke-opacity="0.45" stroke-width="1" rx="13" />
  <text x="600" y="49" text-anchor="middle" fill="#EAD68C" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">INDORE, INDIA • FREELANCE</text>

  <!-- Main Headline (Anuj Bansal) -->
  <text x="600" y="118" text-anchor="middle" fill="url(#gold-grad)" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="1">Anuj Bansal</text>

  <!-- Subheadline / Role -->
  <text x="600" y="158" text-anchor="middle" fill="#F7F7F5" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="2" opacity="0.95">FULL STACK DEVELOPER • NEXT.JS &amp; MERN ARCHITECT</text>

  <!-- Subtitle Feature Pills -->
  <text x="600" y="190" text-anchor="middle" fill="#D8CDB8" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" letter-spacing="1">High-Performance Web Apps • Headless Payload CMS • Scalable Infrastructure</text>
</svg>
